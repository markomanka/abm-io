# Build, test, sanitizers, MPI and coverage on GitHub-hosted runners (docs/QUALITY-GATES.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository policies
        run: scripts/check-policy.sh
      - name: Formatting (clang-format pinned to the version used for the code)
        run: |
          pipx install clang-format==23.1.3
          find include src tests fuzz bench \( -name '*.h' -o -name '*.cc' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build-test:
    name: Build and test (${{ matrix.os }}, ${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc, cxx: g++ }
          - { os: ubuntu-24.04, compiler: clang, cxx: clang++ }
          - { os: ubuntu-22.04, compiler: gcc, cxx: g++ }
          - { os: macos-15, compiler: apple-clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config liblz4-dev libgtest-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja lz4 googletest pkgconf
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DABMIO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark smoke run
        run: build/abmio_bench --quick

  sanitizers:
    name: Sanitizers (address, undefined)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config liblz4-dev libgtest-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
          -DABMIO_SANITIZE=address,undefined -DABMIO_BUILD_BENCHMARKS=OFF
      - run: cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  mpi:
    name: MPI (${{ matrix.mpi }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mpi: mpich, packages: libmpich-dev mpich, preflags: "" }
          - { mpi: openmpi, packages: libopenmpi-dev openmpi-bin, preflags: "--oversubscribe" }
    runs-on: ubuntu-24.04
    env:
      # MPICH's UCX layer can fail to start on GitHub runners while probing network
      # devices; two ranks on one machine only need shared memory.
      UCX_TLS: self,sm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config liblz4-dev libgtest-dev ${{ matrix.packages }}
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DABMIO_ENABLE_MPI=ON -DABMIO_BUILD_BENCHMARKS=OFF
          -DABMIO_MPI_RANKS=2 "-DMPIEXEC_PREFLAGS=${{ matrix.preflags }}"
      - run: cmake --build build
      - name: Test (2 ranks)
        run: ctest --test-dir build -L mpi --output-on-failure

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config liblz4-dev libgtest-dev
      - run: pipx install gcovr==8.7
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DABMIO_COVERAGE=ON -DABMIO_BUILD_BENCHMARKS=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Report (fails below 85% line coverage)
        run: |
          mkdir -p coverage
          gcovr -r . --filter src/ --filter include/ --fail-under-line 85 \
            --txt coverage/summary.txt --html-details coverage/index.html build
          cat coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  ci-ok:
    name: CI passed
    if: always()
    needs: [policy, build-test, sanitizers, mpi, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs succeeded
        run: |
          echo 'results: ${{ join(needs.*.result, ', ') }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
