# Known-vulnerability scan of dependencies and vendored code (OSV database).
name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 2 * * 2'

permissions:
  contents: read

jobs:
  scan:
    if: vars.PUBLIC_REPO == 'true'
    # Only this job uploads results, so only it may write security events.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
