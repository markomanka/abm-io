# Static security analysis. Free on public repositories; enabled by the PUBLIC_REPO variable.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    if: vars.PUBLIC_REPO == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config liblz4-dev libhdf5-dev
      # Configure before CodeQL starts tracing: the tracer only needs to see the
      # compilation, and FindHDF5's compiler probes (h5cc, try_compile) hung
      # under it for hours in pull request #57.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DABMIO_BUILD_TESTS=OFF
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build
        run: cmake --build build
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:c-cpp
