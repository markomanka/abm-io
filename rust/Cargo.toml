# SPDX-License-Identifier: Apache-2.0
[package]
name = "abmio-codec"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "abm-io's delta decoder in Rust, behind a C interface (experiment: see docs/ROADMAP.md, milestone R)"
publish = false

# No third-party crates in the decoder: the dependency list stays empty.
[dependencies]

[lib]
name = "abmio_codec"
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"      # a panic must not unwind into C++
overflow-checks = true
